[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g15display"
version = "1.0.0"
description = "Python-Prototyp für das Display der ursprünglichen Logitech G15"
requires-python = ">=3.10"
dependencies = ["hidapi>=0.14,<0.16", "Pillow>=10.1,<14", "psutil>=6,<9"]

[project.scripts]
g15 = "g15display.__main__:main"

[project.optional-dependencies]
app = ["pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'", "pyobjc-framework-Quartz>=11,<13; sys_platform == 'darwin'", "pyinstaller>=6.16,<7"]

[project.gui-scripts]
g15-app = "g15display.macos_app:main"

[tool.setuptools.packages.find]
include = ["g15display*"]
